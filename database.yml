# database.yml exists for the `soda` CLI during development, and for nothing
# else. The application itself never reads it: `serve` and `migrate` take their
# connection from the Effective Config (see docs/adr/0005).
#
# Every entry defers to the same environment variable the binary reads, so
# PW_DATABASE_URL is the single source of truth for both. The literal fallbacks
# are local development defaults, not secrets, and must stay identical to
# config.DevDatabaseURL in internal/config/load.go.
#
# Do not run `soda migrate`: it writes to the same schema_migration table as
# `personal-web migrate` but from a different set of files. Use `soda` only for
# `soda create` and `soda drop`.

development:
  url: {{ envOr "PW_DATABASE_URL" "postgres://postgres:postgres@127.0.0.1:5432/pw_dev?sslmode=disable" }}

test:
  url: {{ envOr "PW_TEST_DATABASE_URL" "postgres://postgres:postgres@127.0.0.1:5432/pw_test?sslmode=disable" }}
