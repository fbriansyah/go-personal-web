# air rebuilds and restarts the server while you edit (see `make watch`).
#
# It owns only the Go half of the loop: templ turns .templ into _templ.go and
# tailwind turns the sources into app.css, and both of those land in files air
# watches, so a template or a class change reaches the browser through the same
# rebuild as a change to a handler.
root = "."
tmp_dir = "tmp"

[build]
  # No `templ generate` here: the templ watcher already ran it, and running it
  # again from the build would regenerate the files air is watching and loop.
  cmd = "go build -o ./tmp/personal-web ."
  entrypoint = ["./tmp/personal-web", "serve"]

  # The stylesheet is embedded (ADR-0013), so a CSS change is a rebuild too.
  include_ext = ["go", "css"]
  exclude_dir = ["bin", "tmp", "docs", ".git", ".claude"]
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = true

  # Nothing notifies templ's proxy from here: air's post_cmd runs on exit, not
  # after a build, and notifying from the build would reload the browser before
  # the new binary is listening. The templ watcher does the notifying — it
  # watches .go as well as .templ — so the browser reloads on its own.

  delay = 200
  stop_on_error = false
  send_interrupt = true
  kill_delay = "2s"

[misc]
  clean_on_exit = true
